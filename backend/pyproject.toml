[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-lost-found"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "pydantic-settings>=2.6,<3",
  "pydantic[email]>=2.9,<3", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.18,<1", "google-genai>=1,<2",
  "pillow>=11,<13", "filetype>=1.2,<2", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
